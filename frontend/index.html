<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phishing check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f4; --panel:#fff; --ink:#1b2430; --muted:#5d6b7c; --line:#d5dbe3;
  --high:#c0392b; --mid:#b7791f; --low:#2b7a5a; --accent:#1f4e79;
  --font:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font)}
main{max-width:1100px;margin:0 auto;padding:32px 20px 64px}
h1{font-size:2rem;line-height:1.15;margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
.sub{margin:0 0 28px;color:var(--muted);max-width:60ch}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:8px 14px;font:inherit;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
textarea{width:100%;min-height:280px;resize:vertical;padding:12px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:.95rem}
.subject{width:100%;padding:10px 12px;margin-bottom:10px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:.95rem}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:200px;border:2px dashed var(--line);border-radius:8px;text-align:center;padding:24px;cursor:pointer;color:var(--muted)}
.drop.over,.drop:focus-within{border-color:var(--accent);background:#f5f8fb}
.drop strong{color:var(--ink)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
button.go{margin-top:16px;width:100%;padding:12px;border:0;border-radius:6px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.go:disabled{opacity:.55;cursor:progress}
:focus-visible{outline:3px solid #7aa7d3;outline-offset:2px}
.hidden{display:none!important}
.empty{color:var(--muted);margin:0}
.error{color:var(--high);margin:0;font-weight:500}
.verdict{--lvl:var(--low)}
.verdict.high{--lvl:var(--high)} .verdict.mid{--lvl:var(--mid)}
.verdict h2{margin:0;font-size:1.6rem;color:var(--lvl);letter-spacing:-.01em}
.verdict p{margin:2px 0 14px;color:var(--muted)}
.meter{height:12px;background:#e6eaef;border-radius:6px;overflow:hidden}
.meter>i{display:block;height:100%;width:0;background:var(--lvl);transition:width .5s ease}
h3{font-size:1rem;margin:24px 0 10px}
.row{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;font-size:.9rem;margin:6px 0}
.row .label{color:var(--muted)}
.row .pct{text-align:right;font-variant-numeric:tabular-nums}
.link{border-top:1px solid var(--line);padding:10px 0}
.link:first-of-type{border-top:0}
.url{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;word-break:break-all}
.link .meta{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;margin-top:4px;color:var(--muted)}
.tag{font-weight:600}
.tag.high{color:var(--high)} .tag.mid{color:var(--mid)} .tag.low{color:var(--low)}
dl{display:grid;grid-template-columns:100px 1fr;gap:4px 12px;margin:0;font-size:.9rem}
dt{color:var(--muted)} dd{margin:0;word-break:break-word}
.flag{margin:14px 0 0;padding:8px 12px;border-left:3px solid var(--mid);background:#fbf3e4;font-size:.9rem}
.note{font-size:.82rem;color:var(--muted);margin-top:22px}
@media (prefers-reduced-motion:reduce){.meter>i{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Phishing check</h1>
  <p class="sub">Paste an email or upload an .eml file. The message and every link in it are scored by a DistilBERT classifier.</p>

  <div class="grid">
    <section class="card" aria-label="Input">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-text" aria-selected="true" aria-controls="pane-text">Paste text</button>
        <button class="tab" role="tab" id="tab-eml" aria-selected="false" aria-controls="pane-eml">Upload .eml</button>
      </div>

      <div id="pane-text" role="tabpanel" aria-labelledby="tab-text">
        <label for="subject" class="hidden">Subject</label>
        <input id="subject" class="subject" type="text" placeholder="Subject (optional)" autocomplete="off">
        <label for="text" class="hidden">Email content</label>
        <textarea id="text" placeholder="Paste the email body here, including any links."></textarea>
      </div>

      <div id="pane-eml" role="tabpanel" aria-labelledby="tab-eml" class="hidden">
        <label class="drop" id="drop">
          <input type="file" id="file" accept=".eml,message/rfc822">
          <strong id="file-name">Choose an .eml file</strong>
          <span>or drop it here (max 5 MB)</span>
        </label>
      </div>

      <button class="go" id="go">Check email</button>
    </section>

    <section class="card" aria-label="Result" aria-live="polite" id="result">
      <p class="empty">Results appear here.</p>
    </section>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
let mode = "text", file = null;

function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;  // textContent only: email content is untrusted
  return n;
}
const pct = x => (x * 100).toFixed(1) + "%";
const level = s => s >= 0.7 ? "high" : s >= 0.4 ? "mid" : "low";
const pretty = l => l.replace(/_/g, " ");

// Tabs
function setMode(m){
  mode = m;
  for (const t of ["text", "eml"]){
    $("#tab-" + t).setAttribute("aria-selected", t === m);
    $("#pane-" + t).classList.toggle("hidden", t !== m);
  }
}
$("#tab-text").onclick = () => setMode("text");
$("#tab-eml").onclick = () => setMode("eml");

// File selection + drag and drop
function setFile(f){
  file = f;
  $("#file-name").textContent = f ? f.name : "Choose an .eml file";
}
$("#file").onchange = e => setFile(e.target.files[0] || null);
const drop = $("#drop");
["dragover", "dragenter"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => setFile(e.dataTransfer.files[0] || null));

// Analyze
$("#go").onclick = async () => {
  const box = $("#result");
  let req;
  if (mode === "text"){
    const text = $("#text").value.trim();
    if (!text) return showMessage("Paste the email content first.", true);
    req = fetch("/api/analyze", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({subject: $("#subject").value.trim(), text})});
  } else {
    if (!file) return showMessage("Choose an .eml file first.", true);
    const fd = new FormData(); fd.append("file", file);
    req = fetch("/api/analyze-eml", {method: "POST", body: fd});
  }
  $("#go").disabled = true; $("#go").textContent = "Checking…";
  try {
    const res = await req;
    if (!res.ok){
      const err = await res.json().catch(() => ({}));
      throw new Error(typeof err.detail === "string" ? err.detail : `Request failed (${res.status}).`);
    }
    render(await res.json());
  } catch (e){
    showMessage(e.message, true);
  } finally {
    $("#go").disabled = false; $("#go").textContent = "Check email";
  }
};

function showMessage(msg, isError){
  const box = $("#result"); box.replaceChildren(el("p", isError ? "error" : "empty", msg));
}

function probRow(label, p, lvl){
  const r = el("div", "row verdict " + lvl);
  r.append(el("span", "label", pretty(label)));
  const m = el("div", "meter"), bar = el("i"); bar.style.width = pct(p); m.append(bar);
  r.append(m, el("span", "pct", pct(p)));
  return r;
}

function render(d){
  const box = $("#result");
  const lvl = {likely_phishing: "high", suspicious: "mid", likely_legitimate: "low"}[d.verdict];
  const title = {likely_phishing: "Likely phishing", suspicious: "Suspicious", likely_legitimate: "Likely legitimate"}[d.verdict];

  const v = el("div", "verdict " + lvl);
  v.append(el("h2", "", title), el("p", "", `Email phishing score: ${pct(d.score)}`));
  const m = el("div", "meter"), bar = el("i"); m.append(bar); v.append(m);
  box.replaceChildren(v);
  if (d.suspicious_links) box.append(el("p", "flag", `${d.suspicious_links} link${d.suspicious_links > 1 ? "s" : ""} flagged as suspicious (not included in the score).`));
  requestAnimationFrame(() => bar.style.width = pct(d.score));

  // Email body
  box.append(el("h3", "", "Email text"));
  for (const [label, p] of Object.entries(d.email.probs)){
    box.append(probRow(label, p, label.startsWith("phishing") ? "high" : "low"));
  }

  // Links
  box.append(el("h3", "", `Links`));
  if (!d.links.length) box.append(el("p", "empty", "No links found."));
  for (const l of d.links.slice().sort((a, b) => b.phishing_score - a.phishing_score)){
    const item = el("div", "link");
    item.append(el("div", "url", l.url));
    const meta = el("div", "meta");
    meta.append(el("span", "tag " + (l.suspicious ? "mid" : "low"), l.suspicious ? "suspicious" : "not flagged"), el("span", "", "phishing " + pct(l.phishing_score)));
    item.append(meta);
    box.append(item);
  }

  // Headers (eml only)
  const hk = Object.keys(d.headers || {});
  if (hk.length){
    box.append(el("h3", "", "Headers"));
    const dl = el("dl");
    for (const k of hk) dl.append(el("dt", "", k), el("dd", "", d.headers[k]));
    box.append(dl);
  }

  box.append(el("p", "note", "A classifier score is a signal, not proof. Links are not scored and never opened."));
}
</script>
</body>
</html>
